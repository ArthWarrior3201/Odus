<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odus</title>
<meta name="description" content="Download Odus for Windows, macOS and Linux.">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #000;
    --text: #f5f1ea;
    --muted: #a39d94;
    --line: #2a2420;
    --card: #0d0b0a;
    --orange: #ff6a00;
    --yellow: #ffc400;
    --gold: #f5c542;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  /* show just the mark from odus_logo.png (it has wide black edges) */
  .logo { width: min(240px, 60vw); aspect-ratio: 888 / 768; position: relative; overflow: hidden; }
  .logo img { position: absolute; width: 172.973%; height: auto; max-width: none; left: -33.671%; top: -9.245%; }
  h1 { margin: 20px 0 32px; font-size: 3rem; line-height: 1; letter-spacing: .03em; }
  button { font: inherit; }
  button.download {
    font-weight: 700; font-size: 1.15rem;
    color: #1a0d00;
    background: linear-gradient(100deg, var(--orange), var(--yellow));
    border: 0; border-radius: 999px;
    padding: 14px 44px;
    cursor: pointer;
    box-shadow: 0 0 32px rgba(255, 106, 0, .35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button.download:hover { transform: translateY(-1px); box-shadow: 0 0 44px rgba(255, 140, 0, .5); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  button.download[disabled] { opacity: .7; cursor: progress; }

  .panel { width: min(560px, 100%); }
  .options {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  .options a, .options .none {
    display: block;
    padding: 16px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    transition: border-color .15s ease, transform .15s ease;
  }
  .options a:hover { border-color: var(--orange); transform: translateY(-1px); }
  .options a.mine { border-color: var(--orange); box-shadow: 0 0 20px rgba(255, 106, 0, .25); }
  .options .none, .options a.source { grid-column: 1 / -1; }
  .options .none { color: var(--muted); }
  .options a.source { padding: 12px; }
  .options a.source strong { display: inline; margin-right: 8px; }
  .options strong { display: block; font-size: 1.05rem; }
  .options span { color: var(--muted); font-size: .85rem; }

  .info {
    margin-top: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    text-align: left;
  }
  .info .row {
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
    padding: 10px 16px;
  }
  .info .row + .row { border-top: 1px solid var(--line); }
  .info .label { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .info .value { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .info .value small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .info .row.current .value { color: var(--yellow); }

  .link-btn {
    margin-top: 14px;
    background: none; border: 0; padding: 6px 4px;
    color: var(--yellow); cursor: pointer; font-weight: 600;
  }
  .link-btn:hover { text-decoration: underline; }

  .releases { margin-top: 12px; text-align: left; }
  .releases h2 { font-size: 1rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-align: center; }
  .releases ul { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto;
                 border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .releases li + li { border-top: 1px solid var(--line); }
  .releases button.item {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: none; border: 0; padding: 12px 16px; color: var(--text); cursor: pointer; text-align: left;
  }
  .releases button.item:hover { background: #17120f; }
  .releases button.item[aria-current="true"] { color: var(--yellow); }
  .releases .meta { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  .badge { font-size: .7rem; padding: 1px 7px; border-radius: 999px; margin-left: 6px;
           border: 1px solid var(--line); color: var(--muted); vertical-align: middle; }
  .badge.latest { border-color: var(--gold); color: var(--gold); }

  .thanks { width: min(560px, 100%); text-align: left; }
  .thanks h2 { margin: 0 0 4px; font-size: 1.5rem; text-align: center; }
  .thanks .sub { margin: 0 0 20px; color: var(--muted); text-align: center; }
  .thanks ol { margin: 0; padding: 0; list-style: none; counter-reset: step;
               border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .thanks li { counter-increment: step; padding: 12px 16px 12px 48px; position: relative; }
  .thanks li + li { border-top: 1px solid var(--line); }
  .thanks li::before { content: counter(step); position: absolute; left: 16px; top: 12px;
                       width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #1a0d00;
                       font-size: .8rem; font-weight: 700; display: grid; place-items: center; }
  .code { display: flex; align-items: center; gap: 8px; margin-top: 8px;
          background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; }
  .code code { flex: 1; font: .9rem/1.4 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
               color: var(--yellow); overflow-x: auto; white-space: nowrap; }
  .code button { background: #17120f; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                 padding: 4px 10px; cursor: pointer; font-size: .8rem; white-space: nowrap; }
  .code button:hover { border-color: var(--orange); }
  .note { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--gold); border-radius: 14px;
          background: rgba(245, 197, 66, .07); }
  .note strong { color: var(--gold); }
  .note p { margin: 0 0 4px; }
  .thanks .again { margin: 16px 0 0; text-align: center; color: var(--muted); font-size: .9rem; }
  .thanks .again a { color: var(--yellow); }
  .thanks .again .link-btn { margin-top: 0; }

  .status { margin-top: 20px; color: var(--muted); min-height: 1.5em; }
  .status a, footer a { color: var(--yellow); }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
  @media (max-width: 480px) {
    .options { grid-template-columns: 1fr; }
    h1 { font-size: 2.4rem; margin: 16px 0 28px; }
    .info .row { flex-direction: column; gap: 2px; }
    .info .value { text-align: left; }
  }
</style>
</head>
<body>
  <div class="logo"><img src="odus_logo.png" alt="Odus logo" width="1536" height="1024"></div>
  <h1>Odus</h1>

  <button class="download" id="download">Download</button>

  <div class="panel" id="panel" hidden>
    <div class="options" id="options"></div>
    <div class="info">
      <div class="row"><span class="label">Latest release</span><span class="value" id="latest"></span></div>
      <div class="row current"><span class="label">You're downloading</span><span class="value" id="current"></span></div>
    </div>
    <button class="link-btn" id="more" aria-expanded="false">See More Releases &rarr;</button>
    <div class="releases" id="releases" hidden>
      <h2>All Odus releases</h2>
      <ul id="release-list"></ul>
    </div>
  </div>

  <section class="thanks" id="thanks" hidden aria-live="polite">
    <h2>Thank you for downloading Odus!</h2>
    <p class="sub" id="thanks-sub"></p>
    <ol id="thanks-steps"></ol>
    <div class="note" id="thanks-note" hidden></div>
    <p class="again">
      Download didn't start? <a id="thanks-retry" href="#">Try again</a> &middot;
      <button class="link-btn" id="thanks-back">&larr; Back to downloads</button>
    </p>
  </section>

  <p class="status" id="status" aria-live="polite"></p>

  <footer>Python 3.9 or above is required to run odus.py &middot; <a href="https://github.com/ArthWarrior3201/Odus">Source code on GitHub</a></footer>

<script>
  const REPO = "ArthWarrior3201/Odus";
  const API = "https://api.github.com/repos/" + REPO;
  const $ = id => document.getElementById(id);
  const button = $("download"), panel = $("panel"), options = $("options"), status = $("status");
  const more = $("more"), releasesBox = $("releases"), list = $("release-list");
  const linkToReleases = '<a href="https://github.com/' + REPO + '/releases">GitHub releases</a>';
  let latest = null, current = null, allReleases = null;

  function myOS() {
    const p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent;
    if (/win/i.test(p)) return "windows";
    if (/mac|iphone|ipad/i.test(p)) return "macos";
    if (/linux|x11|cros/i.test(p)) return "linux";
    return "";
  }

  async function getJSON(url) {
    const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (res.status === 404) throw new Error("none");
    if (!res.ok) throw new Error("http " + res.status);
    return res.json();
  }

  // Always "Odus v0.1", "Odus v0.2"... built from the release's tag
  function label(el, release) {
    const tag = (release.tag_name || "").trim().replace(/^odus[\s-]*/i, "");
    el.textContent = tag ? "Odus " + (/^v/i.test(tag) ? "v" + tag.slice(1) : "v" + tag)
                         : (release.name || "").trim();
  }

  function card(id, name, asset, note) {
    const a = document.createElement("a");
    a.href = asset.browser_download_url;
    a.download = asset.name;
    if (id === myOS()) a.className = "mine";
    a.innerHTML = "<strong></strong><span></span>";
    a.querySelector("strong").textContent = name;
    a.querySelector("span").textContent = note + " - " + asset.name;
    // the download starts as normal; the page switches to the thank-you screen
    a.addEventListener("click", () => thanks(id, name, asset));
    return a;
  }

  // ------------------------------------------------------- thank-you page
  // Every system gets the same two general steps. Only macOS adds the note
  // about getting past Apple's security check on macOS Tahoe 26 and newer.
  const thanksBox = $("thanks");

  function codeLine(cmd) {
    const box = document.createElement("div");
    box.className = "code";
    const code = document.createElement("code");
    code.textContent = cmd;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "Copy";
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(cmd); copy.textContent = "Copied"; }
      catch { copy.textContent = "Select & copy"; }
      setTimeout(() => { copy.textContent = "Copy"; }, 1500);
    });
    box.append(code, copy);
    return box;
  }

  function step(text, cmd) {
    const li = document.createElement("li");
    li.append(document.createTextNode(text));
    if (cmd) li.append(codeLine(cmd));
    return li;
  }

  function thanks(id, name, asset) {
    const file = asset.name;
    const run = {
      windows: ["Open it: double-click " + file + ", or run it in Command Prompt:", file],
      macos:   ["Open it: in Terminal, go to where you saved it and run:", "chmod +x " + file + " && ./" + file],
      linux:   ["Open it: in a terminal, go to where you saved it and run:", "chmod +x " + file + " && ./" + file],
      source:  ["Open it: in a terminal, go to where you saved it and run:", "python " + file],
    }[id];
    const first = id === "source"
      ? "The first time, Odus asks whether to add itself to your PATH. Needs Python 3.9 or newer."
      : "The first time, Odus asks whether to add itself to your PATH. No Python? It offers to download a private copy just for Odus.";

    label($("thanks-sub"), current);
    $("thanks-sub").textContent += " for " + name + " · " + file;
    $("thanks-steps").replaceChildren(step(run[0], run[1]), step(first));

    const note = $("thanks-note");
    note.replaceChildren();
    note.hidden = id !== "macos";
    if (id === "macos") {
      const p1 = document.createElement("p");
      p1.innerHTML = "<strong>Using macOS Tahoe 26 (Developer Beta) or newer?</strong>";
      const p2 = document.createElement("p");
      p2.textContent = "The older way, right-click > Open and then Open Anyway, won't work there. " +
                       "Instead, remove the com.apple.quarantine flag macOS puts on downloaded files, " +
                       "then open " + file + " as usual. In Terminal, in the folder you saved it to, run:";
      note.append(p1, p2, codeLine("xattr -d com.apple.quarantine " + file));
    }

    $("thanks-retry").href = asset.browser_download_url;
    panel.hidden = true;
    thanksBox.hidden = false;
    thanksBox.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("thanks-back").addEventListener("click", () => {
    thanksBox.hidden = true;
    panel.hidden = false;
  });

  // Fill the download cards for one release. Newer releases ship odus.bat /
  // odus.command / odus.sh; older ones had odus.cmd and odus.sh only.
  function show(release) {
    const find = (...exts) => {
      for (const ext of exts) {
        const hit = (release.assets || []).find(a => a.name.toLowerCase().endsWith(ext));
        if (hit) return hit;
      }
    };
    const win = find(".bat", ".cmd"), mac = find(".command", ".sh"), linux = find(".sh"), py = find(".py");
    options.replaceChildren();
    if (win) options.append(card("windows", "Windows", win, "Command Prompt"));
    if (mac) options.append(card("macos", "macOS", mac, "Terminal"));
    if (linux) options.append(card("linux", "Linux", linux, "Terminal"));
    if (py) {
      const src = card("source", "Python source", py, "Any system");
      src.classList.add("source");
      options.append(src);
    }
    if (!win && !mac && !linux && !py) {
      const none = document.createElement("div");
      none.className = "none";
      none.textContent = "This release has no downloads for Windows, macOS or Linux.";
      options.append(none);
    }
    if (latest) label($("latest"), latest); else $("latest").textContent = "none yet";
    current = release;
    label($("current"), release);
    markCurrent();
  }

  function markCurrent() {
    for (const b of list.querySelectorAll("button.item")) {
      b.setAttribute("aria-current", String(current && b.dataset.id === String(current.id)));
    }
  }

  button.addEventListener("click", async () => {
    button.disabled = true;
    status.textContent = "Checking for the latest release...";
    try {
      latest = await getJSON(API + "/releases/latest");
      show(latest);
      panel.hidden = false;
      button.hidden = true;
      status.textContent = "";
    } catch (err) {
      button.disabled = false;
      status.innerHTML = err.message === "none"
        ? "No release yet. Check " + linkToReleases + " soon."
        : "Couldn't reach GitHub right now. Try again, or go to " + linkToReleases + ".";
    }
  });

  async function loadAllReleases() {
    const out = [];
    for (let page = 1; page <= 10; page++) {
      const batch = await getJSON(API + "/releases?per_page=100&page=" + page);
      out.push(...batch.filter(r => !r.draft));
      if (batch.length < 100) break;
    }
    return out;
  }

  function fillList() {
    list.replaceChildren();
    for (const r of allReleases) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "item";
      b.dataset.id = r.id;
      const left = document.createElement("span");
      label(left, r);
      if (latest && r.id === latest.id) left.insertAdjacentHTML("beforeend", '<span class="badge latest">Latest</span>');
      if (r.prerelease) left.insertAdjacentHTML("beforeend", '<span class="badge">pre-release</span>');
      const meta = document.createElement("span");
      meta.className = "meta";
      const when = r.published_at ? new Date(r.published_at).toLocaleDateString() : "";
      meta.textContent = when + " →";
      b.append(left, meta);
      b.addEventListener("click", () => {
        show(r);
        releasesBox.hidden = true;
        more.setAttribute("aria-expanded", "false");
        more.innerHTML = "See More Releases &rarr;";
        options.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      li.append(b);
      list.append(li);
    }
  }

  more.addEventListener("click", async () => {
    if (!releasesBox.hidden) {
      releasesBox.hidden = true;
      more.setAttribute("aria-expanded", "false");
      more.innerHTML = "See More Releases &rarr;";
      return;
    }
    try {
      if (!allReleases) {
        more.textContent = "Loading releases...";
        allReleases = await loadAllReleases();
        fillList();
      }
      releasesBox.hidden = false;
      more.setAttribute("aria-expanded", "true");
      more.innerHTML = "Hide releases &larr;";
      markCurrent();
    } catch (err) {
      more.innerHTML = "See More Releases &rarr;";
      status.innerHTML = "Couldn't load the list. See all releases on " + linkToReleases + ".";
    }
  });
</script>
</body>
</html>
